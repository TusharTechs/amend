name: amend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    # The regulation as a merge check: no language model, no Bobcoins.
    name: Amend guard (16 CFR 314)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Guard, citing the clause for every failure
        # Each failure is also emitted as an annotation on the offending line.
        run: |
          rc=0
          amend guard --repo demo/lendwise --json guard.json || rc=$?
          python - <<'PY'
          import json
          for f in json.load(open("guard.json")):
              print(f"::error file=demo/lendwise/{f['file']},line={f['line']},title={f['rule']} · {f['clause']}::{f['message']}")
          PY
          exit $rc
      - name: Lendwise regression and obligation tests
        run: pytest -q demo/lendwise

  engine:
    # Engine tests run against the seeded Lendwise on main, where the
    # 13 planted violations are expected to be found.
    name: Engine tests (${{ matrix.os }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
