name: amend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    # The regulation as a merge check: no language model, no Bobcoins.
    name: Amend guard (16 CFR 314)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Guard, citing the clause for every failure
        run: amend guard --repo demo/lendwise
      - name: Lendwise regression and obligation tests
        run: pytest -q demo/lendwise

  engine:
    # Engine tests run against the seeded Lendwise on main, where the
    # 13 planted violations are expected to be found.
    name: Engine tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
